name: Contribution preflight
'on':
  workflow_dispatch:
    inputs:
      patch_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        swift:
        - '6.1'
        - '6.2'
        - '6.3'
        - '6.4'
        - nightly-6.4.x
        - nightly-main
    container:
      image: ${{ startsWith(matrix.swift, 'nightly') && 'swiftlang/swift' || 'swift' }}:${{ matrix.swift }}-jammy
    steps:
    - &id001
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
        submodules: true
        persist-credentials: false
    - &id002
      name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf "Baseline: %s\n" "$BASE_SHA"'
    - name: Tests, release build and Cxx interoperability
      shell: bash
      run: 'swift --version

        swift test ${{ !startsWith(matrix.swift, ''nightly'') && ''-Xswiftc -warnings-as-errors'' || '''' }} --explicit-target-dependency-import-check error

        swift build -c release

        apt-get update -qq

        apt-get install -y -qq jq

        curl --fail -sSL https://raw.githubusercontent.com/apple/swift-nio/e12881f2a69168c984b890eec7a10de70441d2d7/scripts/check-cxx-interop-compatibility.sh -o /tmp/check-cxx.sh

        bash /tmp/check-cxx.sh'
  macos:
    runs-on: ${{ matrix.swift == '6.1' && 'macos-15' || 'macos-26' }}
    strategy:
      fail-fast: false
      matrix:
        swift:
        - '6.1'
        - '6.2'
        - '6.3'
        - '6.4'
    steps:
    - *id001
    - *id002
    - name: Select SDK compatible with Swift 6.1
      if: ${{ matrix.swift == '6.1' }}
      run: 'test -d /Applications/Xcode_16.4.app

        echo "DEVELOPER_DIR=/Applications/Xcode_16.4.app/Contents/Developer" >> "$GITHUB_ENV"'
    - uses: swift-actions/setup-swift@7e293214cba9e9225c93ce3267f17f6efdb656a8
      with:
        swift-version: ${{ matrix.swift }}
    - name: Prove Apple-only regression on unmodified handler
      if: ${{ matrix.swift == '6.3' }}
      shell: bash
      run: 'git show "$BASE_SHA":Sources/AsyncDNSResolver/dnssd/DNSResolver_dnssd.swift > Sources/AsyncDNSResolver/dnssd/DNSResolver_dnssd.swift

        set +e

        swift test --filter DNSSDQueryReplyHandlerTests.test_noSuchRecordReturnsEmptyReply > /tmp/dnssd-red.log 2>&1

        status=$?

        set -e

        cat /tmp/dnssd-red.log

        test "$status" -ne 0

        grep ''threw error'' /tmp/dnssd-red.log

        grep ''NoSuchRecord\|DNSSDError(code: -65554)'' /tmp/dnssd-red.log

        git restore Sources/AsyncDNSResolver/dnssd/DNSResolver_dnssd.swift'
      env:
        BASE_SHA: ${{ inputs.base_sha }}
    - name: Swift build and test
      run: 'swift --version

        xcodebuild -version

        swift build --build-tests

        swift test'
  windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        swift:
        - '6.1'
        - '6.2'
        - '6.3'
        - nightly-6.4.x
        - nightly-main
    steps:
    - *id001
    - *id002
    - name: Test in upstream Windows container
      shell: pwsh
      run: '$prefix = if ("${{ matrix.swift }}".StartsWith("nightly")) { "swiftlang/swift" } else { "swift" }

        $image = "${prefix}:${{ matrix.swift }}-windowsservercore-ltsc2022"

        Start-Service docker

        docker pull $image

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        $strict = if ("${{ matrix.swift }}".StartsWith("nightly")) { "" } else { "-Xswiftc -warnings-as-errors" }

        docker run --rm -v "${env:GITHUB_WORKSPACE}:C:\source" -w C:\source $image powershell.exe -NoLogo -Command "swift --version; if (`$LASTEXITCODE -ne 0) { exit `$LASTEXITCODE }; swift test $strict --explicit-target-dependency-import-check error; exit `$LASTEXITCODE"

        exit $LASTEXITCODE'
  xcode:
    runs-on: macos-26
    steps:
    - *id001
    - *id002
    - name: Latest installed Xcode and Apple SDK builds
      shell: bash
      run: "ls /Applications | grep Xcode\nxcodebuild -version\nswift --version\nswift build --build-tests\nswift test\nfor destination in 'generic/platform=macos,variant=macos' 'generic/platform=ios' 'generic/platform=watchos' 'generic/platform=tvos' 'generic/platform=visionos'; do\n  xcodebuild -quiet -scheme swift-async-dns-resolver -destination \"$destination\" build\ndone"
  static-sdk:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        branch:
        - latest
        - main
    container:
      image: ubuntu:jammy
    steps:
    - run: apt-get update -qq && apt-get install -y -qq git curl jq tar
    - *id001
    - *id002
    - name: Install and build static Swift SDK
      shell: bash
      run: "curl --fail -sSL https://raw.githubusercontent.com/apple/swift-nio/e12881f2a69168c984b890eec7a10de70441d2d7/scripts/install_swift_prerequisites.sh -o /tmp/prereqs.sh\nbash /tmp/prereqs.sh\ncurl --fail -sSL https://raw.githubusercontent.com/apple/swift-nio/e12881f2a69168c984b890eec7a10de70441d2d7/scripts/install_swift_sdk.sh -o /tmp/sdk.sh\nif [[ \"${{ matrix.branch }}\" == latest ]]; then\n  INSTALL_SWIFT_VERSION=latest INSTALL_SWIFT_ARCH=x86_64 bash /tmp/sdk.sh\nelse\n  INSTALL_SWIFT_BRANCH=main INSTALL_SWIFT_ARCH=x86_64 bash /tmp/sdk.sh\nfi\nhash -r\nswift --version\nswift build --swift-sdks-path /tmp/swiftsdks --swift-sdk x86_64-swift-linux-musl"
  soundness-docs-check:
    name: Documentation check
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-noble
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf "Baseline: %s\n" "$BASE_SHA"'
    - name: Checkout swiftlang/github-workflows repository
      if: ${{ github.repository != 'swiftlang/github-workflows' }}
      uses: actions/checkout@v4
      with:
        repository: swiftlang/github-workflows
        path: github-workflows
        ref: a0e26726cfe9f46c9eec63f7af64060bb733761f
    - name: Determine script-root path
      id: script_path
      run: "if [ \"${{ github.repository }}\" = \"swiftlang/github-workflows\" ]; then\n  echo \"root=$GITHUB_WORKSPACE\" >> $GITHUB_OUTPUT\nelse\n  echo \"root=$GITHUB_WORKSPACE/github-workflows\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Pre-build
      if: null
      run: null
    - name: Run documentation check
      env:
        ADDITIONAL_DOCC_ARGUMENTS: null
      run: ${{ steps.script_path.outputs.root }}/.github/workflows/scripts/check-docs.sh
  soundness-unacceptable-language-check:
    name: Unacceptable language check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf "Baseline: %s\n" "$BASE_SHA"'
    - name: Checkout swiftlang/github-workflows repository
      if: ${{ github.repository != 'swiftlang/github-workflows' }}
      uses: actions/checkout@v4
      with:
        repository: swiftlang/github-workflows
        path: github-workflows
        ref: a0e26726cfe9f46c9eec63f7af64060bb733761f
    - name: Determine script-root path
      id: script_path
      run: "if [ \"${{ github.repository }}\" = \"swiftlang/github-workflows\" ]; then\n  echo \"root=$GITHUB_WORKSPACE\" >> $GITHUB_OUTPUT\nelse\n  echo \"root=$GITHUB_WORKSPACE/github-workflows\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Run unacceptable language check
      env:
        UNACCEPTABLE_WORD_LIST: blacklist whitelist slave master sane sanity insane insanity kill killed killing hang hung hanged hanging
      run: ${{ steps.script_path.outputs.root }}/.github/workflows/scripts/check-unacceptable-language.sh
  soundness-license-header-check:
    name: License headers check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf "Baseline: %s\n" "$BASE_SHA"'
    - name: Checkout swiftlang/github-workflows repository
      if: ${{ github.repository != 'swiftlang/github-workflows' }}
      uses: actions/checkout@v4
      with:
        repository: swiftlang/github-workflows
        path: github-workflows
        ref: a0e26726cfe9f46c9eec63f7af64060bb733761f
    - name: Determine script-root path
      id: script_path
      run: "if [ \"${{ github.repository }}\" = \"swiftlang/github-workflows\" ]; then\n  echo \"root=$GITHUB_WORKSPACE\" >> $GITHUB_OUTPUT\nelse\n  echo \"root=$GITHUB_WORKSPACE/github-workflows\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Run license header check
      env:
        PROJECT_NAME: SwiftAsyncDNSResolver
      run: ${{ steps.script_path.outputs.root }}/.github/workflows/scripts/check-license-header.sh
  soundness-broken-symlink-check:
    name: Broken symlinks check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf "Baseline: %s\n" "$BASE_SHA"'
    - name: Checkout swiftlang/github-workflows repository
      if: ${{ github.repository != 'swiftlang/github-workflows' }}
      uses: actions/checkout@v4
      with:
        repository: swiftlang/github-workflows
        path: github-workflows
        ref: a0e26726cfe9f46c9eec63f7af64060bb733761f
    - name: Determine script-root path
      id: script_path
      run: "if [ \"${{ github.repository }}\" = \"swiftlang/github-workflows\" ]; then\n  echo \"root=$GITHUB_WORKSPACE\" >> $GITHUB_OUTPUT\nelse\n  echo \"root=$GITHUB_WORKSPACE/github-workflows\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Run broken symlinks check
      run: ${{ steps.script_path.outputs.root }}/.github/workflows/scripts/check-broken-symlinks.sh
  soundness-format-check:
    name: Format check
    runs-on: ubuntu-latest
    container:
      image: swift:6.2-noble
    timeout-minutes: 20
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf "Baseline: %s\n" "$BASE_SHA"'
    - name: Checkout swiftlang/github-workflows repository
      if: ${{ github.repository != 'swiftlang/github-workflows' }}
      uses: actions/checkout@v4
      with:
        repository: swiftlang/github-workflows
        path: github-workflows
        ref: a0e26726cfe9f46c9eec63f7af64060bb733761f
    - name: Determine script-root path
      id: script_path
      run: "if [ \"${{ github.repository }}\" = \"swiftlang/github-workflows\" ]; then\n  echo \"root=$GITHUB_WORKSPACE\" >> $GITHUB_OUTPUT\nelse\n  echo \"root=$GITHUB_WORKSPACE/github-workflows\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Mark the workspace as safe
      run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
    - name: Run format check
      run: ${{ steps.script_path.outputs.root }}/.github/workflows/scripts/check-swift-format.sh
  soundness-shell-check:
    name: Shell check
    runs-on: ubuntu-latest
    container:
      image: ubuntu:noble
    timeout-minutes: 5
    steps:
    - name: Install git
      run: which git || (apt -q update && apt -yq install git)
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf "Baseline: %s\n" "$BASE_SHA"'
    - name: Mark the workspace as safe
      run: git config --global --add safe.directory ${GITHUB_WORKSPACE}
    - name: Run shellcheck
      run: 'which shellcheck || (apt -q update && apt -yq install shellcheck)

        git ls-files -z ''*.sh'' | xargs -0 --no-run-if-empty shellcheck

        '
  soundness-yaml-lint-check:
    name: YAML lint check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf "Baseline: %s\n" "$BASE_SHA"'
    - name: Checkout swiftlang/github-workflows repository
      if: ${{ github.repository != 'swiftlang/github-workflows' }}
      uses: actions/checkout@v4
      with:
        repository: swiftlang/github-workflows
        path: github-workflows
        ref: a0e26726cfe9f46c9eec63f7af64060bb733761f
    - name: Determine script-root path
      id: script_path
      run: "if [ \"${{ github.repository }}\" = \"swiftlang/github-workflows\" ]; then\n  echo \"root=$GITHUB_WORKSPACE\" >> $GITHUB_OUTPUT\nelse\n  echo \"root=$GITHUB_WORKSPACE/github-workflows\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Run yamllint
      run: "which yamllint || (apt -q update && apt install -yq yamllint)\ncd ${GITHUB_WORKSPACE}\nif [ ! -f \".yamllint.yml\" ]; then\n  echo \"Downloading default yamllint config file\"\n  cat ${{ steps.script_path.outputs.root }}/.github/workflows/configs/yamllint.yml > .yamllint.yml\nfi\nyamllint --strict --config-file .yamllint.yml .\n"
  soundness-python-lint-check:
    name: Python lint check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        persist-credentials: false
        submodules: true
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf "Baseline: %s\n" "$BASE_SHA"'
    - name: Checkout swiftlang/github-workflows repository
      if: ${{ github.repository != 'swiftlang/github-workflows' }}
      uses: actions/checkout@v4
      with:
        repository: swiftlang/github-workflows
        path: github-workflows
        ref: a0e26726cfe9f46c9eec63f7af64060bb733761f
    - name: Determine script-root path
      id: script_path
      run: "if [ \"${{ github.repository }}\" = \"swiftlang/github-workflows\" ]; then\n  echo \"root=$GITHUB_WORKSPACE\" >> $GITHUB_OUTPUT\nelse\n  echo \"root=$GITHUB_WORKSPACE/github-workflows\" >> $GITHUB_OUTPUT\nfi\n"
    - name: Run flake8
      run: "pip3 install flake8 flake8-import-order\ncd ${GITHUB_WORKSPACE}\nif [ ! -f \".flake8\" ]; then\n  echo \"Downloading default flake8 config file\"\n  cat ${{ steps.script_path.outputs.root }}/.github/workflows/configs/.flake8 > .flake8\nfi\nflake8\n"
