name: Upstream Linux matrix
'on':
  workflow_dispatch:
    inputs:
      patch_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
        - swift: '6.1'
          image: swift:6.1-jammy
        - swift: '6.2'
          image: swift:6.2-noble
        - swift: '6.3'
          image: swift:6.3-noble
        - swift: '6.4'
          image: swift:6.4-resolute
        - swift: nightly-6.4.x
          image: swiftlang/swift:nightly-6.4.x-noble
        - swift: nightly-main
          image: swiftlang/swift:nightly-main-noble
    container:
      image: ${{ matrix.image }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.patch_sha }}
        fetch-depth: 0
        submodules: true
        persist-credentials: false
    - name: Verify exact contribution and baseline
      shell: bash
      env:
        PATCH_SHA: ${{ inputs.patch_sha }}
        BASE_SHA: ${{ inputs.base_sha }}
      run: 'git config --global --add safe.directory "$GITHUB_WORKSPACE"

        test "$(git rev-parse HEAD)" = "$PATCH_SHA"

        git merge-base --is-ancestor "$BASE_SHA" HEAD

        git log -1 --format=fuller

        printf "Baseline: %s\n" "$BASE_SHA"'
    - name: Tests, release build and Cxx interoperability
      shell: bash
      run: 'swift --version

        swift test ${{ !startsWith(matrix.swift, ''nightly'') && ''-Xswiftc -warnings-as-errors'' || '''' }} --explicit-target-dependency-import-check error

        swift build -c release

        apt-get update -qq

        apt-get install -y -qq jq

        curl --fail -sSL https://raw.githubusercontent.com/apple/swift-nio/e12881f2a69168c984b890eec7a10de70441d2d7/scripts/check-cxx-interop-compatibility.sh -o /tmp/check-cxx.sh

        bash /tmp/check-cxx.sh'
